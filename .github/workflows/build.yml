name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the "latest" / tagged release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK (platform 34 + licenses accepted)
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug + release APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/vinyl-player.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/vinyl-player-debug.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: vinyl-player-apk
          path: dist/*.apk

      # Rolling pre-release: always the newest main build, downloadable from the phone without logging in.
      - name: Publish rolling release (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/*.apk \
            --prerelease \
            --title "Latest build" \
            --notes "Automated build of ${GITHUB_SHA::7}. Install vinyl-player.apk." \
            --target "$GITHUB_SHA"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
